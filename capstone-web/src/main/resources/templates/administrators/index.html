<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>List Of Administrators</title>
</head>
<body>
    <h1 th:text="'List Of Administrators'">List of Administrators...</h1>
<table>
  <thead>
  <tr>
    <th>Id</th>
    <th>First Name</th>
    <th>Last Name</th>
    <th>Email</th>
    <th>Phone</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="admin : ${administrators}">
    <td th:text="${admin?.getId()}"></td>
    <td th:text="${admin?.firstName}"></td>
    <td th:text="${admin?.lastName}"></td>
    <td th:text="${admin?.email}"></td>
    <td th:text="${admin?.phone}"></td>
  </tr>
  </tbody>
</table>
</body>
</html>
