<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>List Of Faculties</title>
</head>
<body>
<h1 th:text="'List Of Faculties'">List of Faculties...</h1>
<table>
  <thead>
  <tr>
    <th>Id</th>
    <th>First Name</th>
    <th>Last Name</th>
    <th>Email</th>
    <th>Phone</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="faculty : ${faculties}">
    <td th:text="${faculty?.getId()}"></td>
    <td th:text="${faculty?.firstName}"></td>
    <td th:text="${faculty?.lastName}"></td>
    <td th:text="${faculty?.getEmail()}"></td>
    <td th:text="${faculty?.getPhone()}"></td>
  </tr>
  </tbody>
</table>
</body>
</html>
